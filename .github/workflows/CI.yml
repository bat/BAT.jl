name: CI

env:
  JULIA_NUM_THREADS: 'auto'

on:
  push:
    branches:
      - main
      - dev
      - 'releases/**'
    tags: '*'
  pull_request:
  release:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.test-group }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'nightly' || matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
        test-group:
          - core
          - stats
          - mcmc
          - hmc
        include:
          - {version: 1, os: ubuntu-latest, arch: x86, test-group: core}
          - {version: 1, os: ubuntu-latest, arch: x86, test-group: stats}
          - {version: 1, os: ubuntu-latest, arch: x86, test-group: mcmc}
          - {version: 1, os: ubuntu-latest, arch: x86, test-group: hmc}
          - {version: 1, os: macOS-latest, arch: arm64, test-group: core}
          - {version: 1, os: macOS-latest, arch: arm64, test-group: stats}
          - {version: 1, os: macOS-latest, arch: arm64, test-group: mcmc}
          - {version: 1, os: macOS-latest, arch: arm64, test-group: hmc}
          - {version: 1, os: windows-latest, arch: x64, test-group: core}
          - {version: 1, os: windows-latest, arch: x64, test-group: stats}
          - {version: 1, os: windows-latest, arch: x64, test-group: mcmc}
          - {version: 1, os: windows-latest, arch: x64, test-group: hmc}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          BAT_TEST_GROUP: ${{ matrix.test-group }}
        with:
          coverage: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.arch == 'x64' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
  test-optional:
    name: Optional ${{ matrix.optional-test }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    # Tests of poorly maintained or otherwise troublesome optional
    # dependencies run isolated and non-blocking:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        optional-test:
          - nestedsamplers
          - ultranest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run tests
        run: >-
          julia --project=test/optional/${{ matrix.optional-test }} -e '
          using Pkg; Pkg.instantiate();
          include(joinpath("test", "optional", "${{ matrix.optional-test }}", "runtests.jl"))'
  test-mgvi:
    name: MGVI - ${{ github.event_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run tests
        run: >-
          julia --project=test/optional/mgvi --code-coverage=user -e '
          using Pkg; Pkg.instantiate();
          include(joinpath("test", "optional", "mgvi", "runtests.jl"))'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
  test-elliptical-slice-sampling:
    name: EllipticalSliceSampling - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run tests
        run: >-
          julia --project=test/optional/ellipticalslicesampling --code-coverage=user -e '
          using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate();
          include(joinpath("test", "optional", "ellipticalslicesampling", "runtests.jl"))'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
  test-slicesampling:
    name: SliceSampling - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run tests
        run: >-
          julia --project=test/optional/slicesampling --code-coverage=user -e '
          using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate();
          include(joinpath("test", "optional", "slicesampling", "runtests.jl"))'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
  test-makie:
    name: Makie lifecycle - Julia ${{ matrix.version }} - group ${{ matrix.test-group }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        test-group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate optional Makie tests against this checkout
        run: >-
          julia --project=test/optional/makie -e '
          using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      # Julia 1.10 coverage needs different caches from ordinary precompilation.
      - name: Prepare Makie packages for coverage
        timeout-minutes: 30
        env:
          JULIA_NUM_THREADS: '2'
        run: julia --startup-file=no --project=test/optional/makie --code-coverage=user -e 'using BAT, CairoMakie, Makie'
      - name: Run bounded CairoMakie lifecycle cases and regressions
        env:
          JULIA_NUM_THREADS: '2'
          BAT_MAKIE_CASE_TIMEOUT: '600'
          BAT_MAKIE_TEST_GROUP: ${{ matrix.test-group }}
          BAT_MAKIE_TEST_GROUPS: '4'
        run: julia --project=test/optional/makie --code-coverage=user test/optional/makie/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
  test-plots:
    name: Plots weight arithmetic - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate optional Plots tests against this checkout
        run: >-
          julia --project=test/optional/plots -e '
          using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run legacy Plots weight regressions
        run: julia --project=test/optional/plots --code-coverage=user test/optional/plots/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed due to https://github.com/JuliaDocs/Documenter.jl/issues/1177
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: 'nul'
